# =====================================================================
# Delicia Caseira da Elaine - configuracao principal (PostgreSQL)
# Segredos NUNCA ficam aqui: use variaveis de ambiente ou o arquivo .env
# (copie .env.exemplo para .env). O .env esta no .gitignore.
# =====================================================================
spring.application.name=delicia-caseira
spring.config.import=optional:file:./.env[.properties]

server.port=${PORTA:8080}
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never

# Banco de dados (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/delicia_caseira}
spring.datasource.username=${DB_USUARIO:delicia}
spring.datasource.password=${DB_SENHA}

# O esquema e criado e versionado SOMENTE pelo Flyway; o Hibernate apenas valida.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Upload de fotos dos produtos
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
app.uploads.dir=${UPLOADS_DIR:./dados/fotos}

# Fuso horario do negocio (Baixa Verde - MG)
app.zona=America/Sao_Paulo

# Conta da administradora criada na primeira execucao (senha somente por variavel de ambiente)
app.admin.nome=${ADMIN_NOME:Elaine Aparecida Ribeiro Domingues}
app.admin.usuario=${ADMIN_USUARIO:elaine}
app.admin.senha=${ADMIN_SENHA:}
app.admin.redefinir-senha=${ADMIN_REDEFINIR_SENHA:false}
