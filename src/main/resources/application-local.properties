# =====================================================================
# Perfil "local" (MODO RAPIDO): roda sem instalar o PostgreSQL.
# Uso: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# Banco H2 em ARQUIVO (./dados-locais/delicia.mv.db) no modo PostgreSQL:
# os dados continuam salvos entre execucoes. O mesmo V1__schema.sql do
# Flyway e aplicado aqui. Apague a pasta dados-locais/ para recomecar.
# ATENCAO: perfil para demonstracao/avaliacao. Em uso real, use PostgreSQL.
# =====================================================================
spring.datasource.url=jdbc:h2:file:./dados-locais/delicia;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=

app.uploads.dir=./dados-locais/fotos

# Conta de demonstracao criada na primeira execucao (pode ser sobrescrita por ADMIN_SENHA)
app.admin.usuario=${ADMIN_USUARIO:elaine}
app.admin.senha=${ADMIN_SENHA:Delicia2026}
