<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #fffdf9; }
      .circulo-externo { fill: none; stroke: #b85d19; stroke-width: 6; }
      .circulo-interno { fill: none; stroke: #b85d19; stroke-width: 2; }
      .texto-arco { font-family: 'Fraunces', serif; font-size: 32px; font-weight: 700; fill: #2b1a0e; letter-spacing: 2px; }
      .pao-base { fill: #d4833c; stroke: #8a4515; stroke-width: 3; }
      .pao-detalhe { fill: none; stroke: #fff6e8; stroke-width: 4; stroke-linecap: round; }
      .coracao { fill: #c0392b; stroke: #8a251b; stroke-width: 2; }
      .trigo { fill: #c88a3b; }
    </style>
  </defs>

  <!-- Fundo Circular e Bordas -->
  <circle cx="200" cy="200" r="190" class="bg" />
  <circle cx="200" cy="200" r="185" class="circulo-externo" />
  <circle cx="200" cy="200" r="173" class="circulo-interno" />

  <!-- Ramos de Trigo Decorativos -->
  <g class="trigo" transform="translate(45, 130) rotate(-25)">
    <path d="M0,50 Q10,25 0,0 Q15,20 20,50 Z" />
    <ellipse cx="5" cy="15" rx="4" ry="7" transform="rotate(-30 5 15)" />
    <ellipse cx="12" cy="25" rx="4" ry="7" transform="rotate(30 12 25)" />
    <ellipse cx="2" cy="35" rx="4" ry="7" transform="rotate(-30 2 35)" />
  </g>
  <g class="trigo" transform="translate(355, 130) scale(-1, 1) rotate(-25)">
    <path d="M0,50 Q10,25 0,0 Q15,20 20,50 Z" />
    <ellipse cx="5" cy="15" rx="4" ry="7" transform="rotate(-30 5 15)" />
    <ellipse cx="12" cy="25" rx="4" ry="7" transform="rotate(30 12 25)" />
    <ellipse cx="2" cy="35" rx="4" ry="7" transform="rotate(-30 2 35)" />
  </g>

  <!-- Textos Curvados ao Redor -->
  <path id="curva-topo" d="M 60,200 A 140,140 0 1,1 340,200" fill="none" />
  <path id="curva-baixo" d="M 95,280 A 120,120 0 0,0 305,280" fill="none" />

  <text class="texto-arco" text-anchor="middle">
    <textPath href="#curva-topo" startOffset="50%">Delícia Caseira</textPath>
  </text>
  <text class="texto-arco" text-anchor="middle" style="font-size: 28px;">
    <textPath href="#curva-baixo" startOffset="50%">da Elaine</textPath>
  </text>

  <!-- Pão Caseiro Central -->
  <g transform="translate(110, 160)">
    <!-- Corpo do Pão -->
    <path d="M15,50 C15,15 50,5 90,5 C130,5 165,15 165,50 C165,75 140,90 90,90 C40,90 15,75 15,50 Z" class="pao-base" />
    <!-- Cortes Superiores do Pão -->
    <path d="M45,25 Q65,15 85,25" class="pao-detalhe" />
    <path d="M75,20 Q95,12 115,22" class="pao-detalhe" />
    <path d="M105,25 Q125,17 140,28" class="pao-detalhe" />
  </g>

  <!-- Coração Central -->
  <path d="M200,265 C200,260 185,235 170,245 C158,253 162,272 178,285 L200,305 L222,285 C238,272 242,253 230,245 C215,235 200,260 200,265 Z" class="coracao" />
</svg>