<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Painel da Elaine</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script type="module" src="/js/admin/login.js"></script>
</head>
<body>
  <main class="tela-login">
    <form id="form-login" class="cartao" novalidate>
      <img src="/img/logo.svg" alt="" width="80" height="80">
      <h1>Painel da Elaine</h1>
      <p class="suave">Entre com seu usuário e senha.</p>
      <div class="campo">
        <label for="usuario">Usuário</label>
        <input id="usuario" name="usuario" type="text" autocomplete="username" autocapitalize="none" required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="botao grande bloco" id="botao-entrar">Entrar</button>
      <p class="suave"><a href="/">← Voltar para o site</a></p>
    </form>
  </main>
</body>
</html>
