<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produtos · Painel da Elaine</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script type="module" src="/js/admin/produtos.js"></script>
</head>
<body data-pagina="produtos">
  <header id="topo"></header>
  <main class="conteudo">
    <div class="cabecalho-pagina">
      <h1>Produtos e sabores</h1>
      <button type="button" class="botao grande" id="botao-novo">+ Novo produto</button>
    </div>
    <p class="suave">Cada sabor é um produto. Os produtos “no cardápio” aparecem no site para os clientes.</p>

    <form id="form-produto" class="cartao form-admin" hidden novalidate>
      <h2 id="titulo-form">Novo produto</h2>
      <div class="grade-campos">
        <div class="campo"><label for="nome">Nome / sabor *</label><input id="nome" name="nome" type="text" maxlength="100" placeholder="Ex.: Pão de coco" required></div>
        <div class="campo"><label for="preco">Preço (R$) *</label><input id="preco" name="preco" type="text" inputmode="decimal" placeholder="Ex.: 12,50" required></div>
      </div>
      <div class="campo"><label for="descricao">Descrição</label><textarea id="descricao" name="descricao" maxlength="500"></textarea></div>
      <label class="marcar"><input id="ativo" name="ativo" type="checkbox" checked> Mostrar no cardápio do site</label>
      <div class="acoes">
        <button type="submit" class="botao verde" id="botao-salvar">Salvar</button>
        <button type="button" class="botao secundario" id="botao-cancelar">Cancelar</button>
      </div>
    </form>

    <div id="lista" class="lista"><p class="carregando">Carregando…</p></div>
    <input type="file" id="arquivo-foto" accept="image/jpeg,image/png,image/webp" hidden>
  </main>
</body>
</html>
