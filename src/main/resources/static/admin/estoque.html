<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estoque · Painel da Elaine</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script type="module" src="/js/admin/estoque.js"></script>
</head>
<body data-pagina="estoque">
  <header id="topo"></header>
  <main class="conteudo">
    <div class="cabecalho-pagina">
      <h1>Estoque de ingredientes</h1>
      <button type="button" class="botao grande" id="botao-novo">+ Novo item</button>
    </div>
    <p class="suave">Anote quanto tem de cada ingrediente. Quando chegar no mínimo, o item aparece em “Precisa comprar”. Os pedidos não mexem no estoque.</p>

    <form id="form-item" class="cartao form-admin" hidden novalidate>
      <h2 id="titulo-form">Novo item</h2>
      <div class="grade-campos">
        <div class="campo"><label for="nome">Nome *</label><input id="nome" name="nome" type="text" maxlength="100" placeholder="Ex.: Farinha de trigo" required></div>
        <div class="campo"><label for="unidade">Unidade *</label><select id="unidade" name="unidadeMedida" required></select></div>
        <div class="campo"><label for="atual">Quanto tem agora *</label><input id="atual" name="quantidadeAtual" type="text" inputmode="decimal" required></div>
        <div class="campo"><label for="minimo">Comprar quando chegar em *</label><input id="minimo" name="quantidadeMinima" type="text" inputmode="decimal" required></div>
      </div>
      <div class="acoes">
        <button type="submit" class="botao verde" id="botao-salvar">Salvar</button>
        <button type="button" class="botao secundario" id="botao-cancelar">Cancelar</button>
      </div>
    </form>

    <div id="lista" class="lista"><p class="carregando">Carregando…</p></div>
  </main>
</body>
</html>
